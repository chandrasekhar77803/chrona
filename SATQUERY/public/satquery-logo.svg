<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="46" stroke="#0A84FF" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="36" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6 4" />
  <!-- Satellite Orbit Axis -->
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="#00F0FF" stroke-width="1.5" transform="rotate(-30 50 50)" />
  <!-- Earth Globe Core -->
  <circle cx="50" cy="50" r="22" fill="url(#earthGrad)" />
  <!-- Satellite icon on orbit -->
  <circle cx="76" cy="35" r="4" fill="#00F0FF" />
  <line x1="72" y1="35" x2="80" y2="35" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="76" y1="31" x2="76" y2="39" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Radar pulse -->
  <path d="M50 32 A 18 18 0 0 1 68 50" stroke="#30D158" stroke-width="2" stroke-linecap="round" />
  <defs>
    <radialGradient id="earthGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="60%" stop-color="#07204A" />
      <stop offset="100%" stop-color="#020B1A" />
    </radialGradient>
  </defs>
</svg>
